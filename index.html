<title>西安 → 川西小环线 6天5晚自驾攻略｜国庆天气版</title>
<style>
:root{
 --bg:#f4f6fa;--card:#fff;--ink:#132239;--muted:#75839a;--line:#e7ecf3;
 --blue:#1a6ee0;--navy:#123a5e;--teal:#0f9c85;--red:#e05361;--purple:#7a57ef;
 --orange:#ec9615;--sky:#2aa8d8;--shadow:0 8px 26px rgba(18,40,75,.08);--r:18px;
 --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(78px + var(--safe))}
button,a{font:inherit}
.top{
 min-height:265px;color:#fff;display:flex;align-items:flex-end;
 background:linear-gradient(180deg,rgba(6,22,47,.12),rgba(6,22,47,.88)),url("assets/hero.jpg") center/cover;
}
.topin{padding:28px 18px 22px;width:100%;max-width:760px;margin:auto}
.kicker{font-size:12px;font-weight:750;letter-spacing:.08em;opacity:.86;text-transform:uppercase}
h1{font-size:33px;line-height:1.06;margin:7px 0 8px;letter-spacing:-.04em}
.top p{margin:0;font-size:14px;line-height:1.6;opacity:.94}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.quick button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);backdrop-filter:blur(9px);color:#fff;border-radius:13px;padding:10px 9px;font-size:12px;font-weight:650}
main{max-width:760px;margin:auto;padding:12px 12px 0}
.daystrip{display:flex;gap:8px;overflow:auto;padding:3px 1px 12px;scrollbar-width:none;position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 78%,rgba(244,246,250,0))}
.daystrip::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap;font-size:13px;font-weight:650;box-shadow:0 2px 8px rgba(20,40,75,.03)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.view{display:none}.view.active{display:block}
.card{background:#fff;border:1px solid rgba(18,34,58,.04);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;margin-bottom:11px}
.card h2{font-size:21px;margin:0 0 6px}.card h3{font-size:17px;margin:0 0 8px}
.sub{font-size:13px;line-height:1.65;color:var(--muted)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.meta .box{background:#f7f9fc;border-radius:13px;padding:10px}
.box b{display:block;color:#8a96aa;font-size:10px;margin-bottom:4px}
.box span{font-size:12px;line-height:1.5}
.route{background:linear-gradient(135deg,#eef5ff,#eefaf7);border-radius:14px;padding:12px;margin-top:11px;font-size:12.5px;line-height:1.65;color:#3e5870}
.heroimg{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-top:11px;background:#e9edf4}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:9px;top:7px;bottom:18px;width:2px;background:#dfe6ef}
.event{position:relative;margin-bottom:10px}
.dot{position:absolute;left:-22px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--bg)}
.event.food .dot{background:var(--red)}.event.hotel .dot{background:var(--orange)}
.event.transport .dot{background:#66758a}.event.spot .dot{background:var(--teal)}
.ec{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.eventimg{width:100%;height:160px;object-fit:cover;background:#e9edf4}
.ebody{padding:13px}
.etime{font-size:12px;color:var(--blue);font-weight:800}
.etitle{font-size:17px;font-weight:760;margin-top:3px}
.ename{font-size:11px;color:#6f7c92;margin-top:4px}
.edesc{font-size:13px;line-height:1.62;color:#526078;margin-top:6px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;background:#eef2f8;color:#5e6b7e;margin-top:8px;white-space:nowrap}
.badge.warn{background:#fff1e6;color:#b4610b}.badge.hot{background:#ffe9ed;color:#b3253c}
.addr{margin-top:9px;background:#f7f9fc;border-radius:12px;padding:9px 10px;font-size:11.5px;line-height:1.55;color:#58667b}
.addr b{color:#20304b}
.actionrow{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;margin-top:10px}
.actionrow a,.actionrow button{border:0;border-radius:11px;padding:9px 6px;text-align:center;font-size:11.5px;font-weight:680;cursor:pointer;text-decoration:none}
.go{background:#e9f2ff;color:#165ab2}.copy{background:#edf9f5;color:#08795c}.xhs{background:#ffedf1;color:#bd2741}.event.weather .dot{background:var(--sky)}
.notice{border-left:4px solid var(--orange)}
.rain{border-left:4px solid var(--blue)}
.warncard{border-left:4px solid var(--red)}
.list{padding-left:18px;margin:6px 0 0}
.list li{font-size:13px;line-height:1.7;color:#4c5a71;margin-bottom:5px}
.table{width:100%;border-collapse:collapse;margin-top:9px;font-size:11.5px}
.table th{background:#f5f8fc;color:#6d7b91;font-weight:700;text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top;color:#4f5d73}
.bigcopy{border:0;background:#e9f2ff;color:#165ab2;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer}
.mapbar{display:flex;gap:7px;overflow:auto;padding:3px 1px 10px;scrollbar-width:none}
.mapbar::-webkit-scrollbar{display:none}
.mapbar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11.5px;color:#607087}
.mapbar button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.mapView{height:66vh;min-height:380px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
#map{height:100%;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:6px 4px calc(6px + var(--safe));background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #e8edf3;z-index:100;display:grid;grid-template-columns:repeat(9,1fr)}
.bottom button{border:0;background:transparent;color:#7b879a;font-size:8.5px;font-weight:650;padding:6px 0}
.bottom button span{display:block;font-size:18px;line-height:1.2;margin-bottom:1px}
.bottom button.active{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);background:#12233d;color:#fff;padding:8px 13px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.editbox{position:fixed;inset:0;background:rgba(7,14,28,.58);z-index:300;display:none;padding:12px;align-items:center;justify-content:center}
.editbox.show{display:flex}
.editor{background:#fff;border-radius:18px;width:min(720px,100%);height:86vh;padding:13px;display:flex;flex-direction:column}
.editor textarea{flex:1;border:1px solid #dce2eb;border-radius:12px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;resize:none}
.editActions{display:flex;gap:8px;margin-top:9px}
.editActions button{border:0;border-radius:10px;padding:9px 10px;cursor:pointer}
.foodFilters{display:flex;gap:7px;overflow:auto;margin:8px 0 12px;scrollbar-width:none}
.foodFilters::-webkit-scrollbar{display:none}
.foodFilters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;color:#607087;cursor:pointer}
.foodFilters button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.foodItem{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px}
.foodTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.foodName{font-weight:780;font-size:15px;line-height:1.35}
.foodPrice{font-size:11px;font-weight:750;color:#e36b45;background:#fff3ec;border-radius:999px;padding:4px 7px;white-space:nowrap}
.foodMeta{font-size:11.5px;color:#728096;line-height:1.6;margin-top:5px}
.foodNote{font-size:12.5px;color:#4e5d74;line-height:1.6;margin-top:6px}
.foodActions{display:flex;gap:7px;margin-top:9px}
.foodActions a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:8px;font-size:11.5px;font-weight:680;background:#eef4ff;color:#175cb6}
.wtable{width:100%;border-collapse:collapse;font-size:11px;margin-top:9px}
.wtable th{background:#eef4fb;color:#5a6b83;font-weight:700;padding:7px 5px;border:1px solid #e3eaf3;font-size:10.5px}
.wtable td{padding:7px 5px;border:1px solid #e9eff6;color:#4c5a71;text-align:center;line-height:1.45}
.wtable td.city{font-weight:750;color:#20304b;text-align:left;background:#f9fbfe;white-space:nowrap}
.wtable td.wet{background:#e6efff}
.wtable td.heavy{background:#d9e7fb}
.table.tight td:nth-child(3),.table.tight td:nth-child(4){white-space:nowrap}
.legend{font-size:11px;color:#7c8a9f;margin-top:8px;line-height:1.6}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}
.kpi .k{background:#f7f9fc;border-radius:13px;padding:10px;text-align:center}
.kpi .k b{display:block;font-size:17px;color:var(--navy)}
.kpi .k span{font-size:10.5px;color:#8a96aa;line-height:1.4;display:block;margin-top:3px}
.checkgrid{display:grid;gap:8px;margin-top:9px}
.checkgrid .c{background:#f7f9fc;border-radius:13px;padding:11px;font-size:12.5px;line-height:1.6;color:#4c5a71}
.checkgrid .c b{display:block;color:#20304b;font-size:13.5px;margin-bottom:3px}
@media(min-width:760px){
 .top{min-height:330px}.topin{padding-bottom:30px}h1{font-size:46px}
 .heroimg{height:250px}.eventimg{height:220px}
}
</style>
</head>
<body>
<header class="top">
 <div class="topin">
  <div class="kicker">Xi'an → Western Sichuan loop 2026 · 6 days · national day road trip</div>
  <h1>西安 → 川西小环线</h1>

 </div>

<script>
const DEFAULT_TRIP={
"meta":{
 "title":"西安 → 川西小环线 6天5晚自驾攻略｜国庆天气版",

 "back":"10/6 06:30 成都 → 绵阳 → 广元 → 汉中 → 西安，约 700km（假期最后一天，按 12 小时预留）",

 "highpoint":"全程最高点：D5 折多山垭口约 4298m（雪天必查管制）",
 "charge":"电车充电：全程 14 次补电，其中都江堰、丹巴、八美、康定、成都、西安这 6 次必须执行；党岭、甲根坝没有可靠充电桩，进沟前必须满电",
 "summary":"先说个结论：你这版排下来其实是 6 天 5 晚——D1–D5 在玩，D6 是纯返程。我把天气当成排程的第一依据：10/1、10/2 是这六天里唯二的好窗口，10/3 下午开始转坏，10/4–10/5 川西高原有一次明显雨雪过程（塔公 10/4 中雪 1~6℃、新都桥雨夹雪 27mm、折多山必然结冰），10/6 反而转好、正好跑返程。所以：四姑娘山死死钉在 10/2；党岭的海子只在 10/3 早上天气允许时才上；10/4 不要硬闯塔公—新都桥，备选是直接下撤；10/5 折多山必须在上午通过并带防滑链。三个最容易崩的点，我都给了备选方案。这一版另外加了电车充电计划：按高原、低温、暖风折损 30~40% 估算，高速实际续航约 450km、山区约 300~350km，每天都标了「在哪里充、几点充、充到多少」。最重要的三句话：进山前必须满电（都江堰、丹巴、八美、康定）；党岭和甲根坝没有可靠充电桩，按「不充电」规划；山里电量不要低于 25%。"
},
"weatherHighlights":[
 "10/1、10/2 是唯二的好窗口：10/2 四姑娘山小雨 6~14℃、丹巴阵雨 16~29℃，是全程最适合上高原的两天——所以四姑娘山必须排在 10/2，不能挪",
 "10/3 下午开始转坏：丹巴阵雨 15~24℃（14.7mm）、党岭阵雨 6~14℃（19mm），这天不适合上 4000m 的海子",
 "10/4 是全程最危险的一天：塔公中雪 1~6℃、新都桥雨夹雪 2~7℃（27mm）、八美/墨石 2~8℃、甲根坝雨夹雪 3~8℃，3500m 以上全是雪线",
 "10/5 折多山（4298m）大概率积雪结冰：新都桥大雪 1~5℃、康定中雪 5~16℃，必须上午通过 + 带防滑链",
 "10/6 转好：成都多云 16~25℃、西安小雨 15~26℃，适合跑 700km 返程",
 "海拔节奏：映秀 900m → 四姑娘山 3200m → 丹巴 1900m → 党岭 3300m → 塔公 3730m → 折多山 4298m。连续几天在 3000m 以上，红景天和便携氧气早点备"
],
"rainPlans":[
 {"title":"10/2 四姑娘山下小雨（概率大）",
  "plan":"双桥沟是观光车 + 木栈道，小雨照玩；但 3600m 以上会变成雨夹雪，栈道结冰打滑。改法：把双桥沟压缩成半程——坐车到最里面的红杉林，重点看布达拉峰、撵鱼坝、盆景滩，14:00~15:00 就出沟。因为今天还要赶 115km 到丹巴，雨天山路易塌方，天黑前到丹巴是硬指标。"},
 {"title":"10/3 党岭下雨，海子上不去",
  "plan":"党岭的两个海子（甲玉拉措约 4000m、葫芦海 4100m）在雨天是纯受罪：碎石路 + 徒步 4~5 小时 + 全程 6~14℃。改法：这天只到党岭村，泡党岭野温泉，把海子挪到 10/4 清晨看天决定；如果 10/4 还是雨雪，就直接放弃海子，早点下山，把体力留给雪天山路。"},
 {"title":"10/4 塔公—新都桥下雪",
  "plan":"这是全程最需要预案的一天：塔公 3730m 中雪、新都桥 3460m 雨夹雪 27mm、甲根坝雨夹雪，山路上会有明显积雪。三条改法：① 10/3 就把高原段提前走掉（八美—塔公—新都桥），10/4 直接下撤；② 在丹巴多住一晚等雪停；③ 只走到八美/墨石公园就折返，砍掉塔公、新都桥、甲根坝。少看两个点，换一天安全，非常划算。"},
 {"title":"10/5 折多山管制 / 结冰",

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function amap(e){
 const kw=e.navName||e.taxi||e.name||"";
 const city=e.navCity||"";
 let u="https://uri.amap.com/search?keyword="+encodeURIComponent(kw)+"&callnative=1";
 if(city)u+="&city="+encodeURIComponent(city);
 return u;
}
function xhs(e){return "https://www.xiaohongshu.com/search_result?keyword="+encodeURIComponent((e.navName||e.name||"")+" 川西")}
function showToast(t){const el=document.getElementById("toast");el.textContent=t||"已复制";el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1300)}
function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>showToast("已复制")).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();showToast("已复制")}

function cellClass(t){
 if(/中雨|大雨|暴雨/.test(t))return "heavy";
 if(/小雨|雷阵雨/.test(t))return "wet";
 return "";
}

 document.getElementById("weather").innerHTML=`

}function badgeClass(b){
 if(!b)return "";
 if(/高危|关键|必须|易堵/.test(b))return "badge hot";

}

let leafletPromise=null;
function loadLeaflet(){
 if(window.L)return Promise.resolve(true);
 if(leafletPromise)return leafletPromise;
 const sources=[
  ["https://unpkg.com/leaflet@1.9.4/dist/leaflet.css","https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"],
  ["https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"],
  ["https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css","https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"]
 ];
 leafletPromise=new Promise(resolve=>{
  let i=0;
  const tryNext=()=>{
   if(window.L){resolve(true);return}
   if(i>=sources.length){resolve(false);return}
   const pair=sources[i++];
   const link=document.createElement("link");link.rel="stylesheet";link.href=pair[0];document.head.appendChild(link);
   const sc=document.createElement("script");sc.src=pair[1];
   sc.onload=()=>resolve(true);
   sc.onerror=()=>tryNext();
   document.head.appendChild(sc);
  };
  tryNext();
 });
 return leafletPromise;
}
function mapFallback(){
 const el=document.getElementById("map");
 if(el)el.innerHTML='<div style="padding:18px;font-size:13px;line-height:1.75;color:#526078">当前没网（或地图组件加载不了），下面给你当天的路线顺序，离线也能用。</div>';
}
async function initMap(){
 if(mapReady)return true;
 const ok=await loadLeaflet();
 if(!ok){mapFallback();return false}
 map=L.map("map",{zoomControl:true}).setView([30.4,102.0],7);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);
 layerGroup=L.layerGroup().addTo(map);mapReady=true;return true;
}
function addMarker(e){
 if(!Number.isFinite(e.lat))return;
 const isKey=/高危|关键/.test(e.badge||"");
 const icon=L.divIcon({className:"",html:`<div style="width:14px;height:14px;border-radius:50%;background:${isKey?"#e05361":"#1a6ee0"};border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
 marker=L.marker([e.lat,e.lng],{icon}).bindPopup(`<b>${esc(e.time)} ${esc(e.name)}</b><br>${esc(e.title)}<br>${esc(e.address||"")}`).addTo(layerGroup);
}
function renderOfflineRoute(i){
 const box=document.getElementById("offlineRoute");
 if(!box)return;
 if(i<0){box.innerHTML="";return}
 const d=trip.days&&trip.days[i];
 if(!d){box.innerHTML="";return}
 const items=(d.events||[]).filter(e=>e.lat).map((e,n)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div style="min-width:20px;font-weight:800;color:#1a6ee0;font-size:12.5px;padding-top:2px">${n+1}</div><div><div style="font-size:13.5px;font-weight:750">${esc(e.navName||e.name)}</div><div class="sub" style="margin-top:2px">${esc(e.time)} · ${esc(e.name)}</div></div></div>`).join("");
 box.innerHTML=`<div class="card"><h3>\uD83E\uDDED 离线路线顺序（${esc(d.short)} ${esc(d.date)}）</h3><div class="sub">没信号时按这个顺序走；地名可以在「导航」页一键复制。</div><div style="margin-top:6px">${items}</div></div>`;
}
function drawDayMap(i){
 if(!trip.days||!trip.days[i])return;
 if(!map){(async()=>{const ok=await initMap();if(ok){renderOfflineRoute(-1);drawDayMap(i)}else{renderOfflineRoute(i)}})();return}
 layerGroup.clearLayers();if(routeLine){map.removeLayer(routeLine);routeLine=null}
 const pts=[];
 (trip.days[i].events||[]).forEach(e=>{if(Number.isFinite(e.lat)){addMarker(e);pts.push([e.lat,e.lng])}});
 if(pts.length>1)routeLine=L.polyline(pts,{color:"#1a6ee0",weight:4,opacity:.6,dashArray:"8 8"}).addTo(map);
 if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.17));
 setTimeout(()=>{if(map)map.invalidateSize()},120);
}
function renderMapBar(){
 const bar=document.getElementById("mapbar");
 if(!bar)return;
 bar.innerHTML=trip.days.map((d,i)=>`<button class="${i===selectedDay?"active":""}" onclick="selectedDay=${i};renderDayStrip();renderDay();renderMapBar();drawDayMap(${i})">${esc(d.short)} ${esc(d.date)}</button>`).join("");

  </div>
